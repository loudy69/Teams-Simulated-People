<!doctype html>
<html><head><meta charset="utf-8"><title>Teams Demo Attendees</title>
<style>
body{font-family:Segoe UI,sans-serif;max-width:640px;margin:40px auto;padding:0 16px}
label{display:block;margin:14px 0 4px;font-weight:600}
input,select{width:100%;padding:8px;font-size:15px;box-sizing:border-box}
button{margin:18px 8px 0 0;padding:10px 18px;font-size:15px;border:0;background:#5b5fc7;color:#fff;border-radius:4px;cursor:pointer}
button.leave{background:#c4314b}
li{margin:4px 0}
</style></head><body>
<div style="display:flex;align-items:center;gap:14px;margin-bottom:8px">
  <svg width="36" height="36" viewBox="0 0 23 23"><rect width="11" height="11" fill="#f25022"/><rect x="12" width="11" height="11" fill="#7fba00"/><rect y="12" width="11" height="11" fill="#00a4ef"/><rect x="12" y="12" width="11" height="11" fill="#ffb900"/></svg>
  <span style="font-size:20px;font-weight:600;color:#5e5e5e">Microsoft</span>
  <svg width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="8" fill="#5b5fc7"/><circle cx="29" cy="11" r="4.5" fill="#a6a9f0"/><rect x="21" y="17" width="14" height="14" rx="4" fill="#7b83eb"/><rect x="5" y="12" width="21" height="20" rx="4" fill="#4f52b2"/><path d="M10 18h11v3h-4v9h-3v-9h-4z" fill="#fff"/></svg>
  <span style="font-size:20px;font-weight:600;color:#5b5fc7">Teams</span>
</div>
<h2>Simulated Teams attendees</h2>
<p style="color:#a4262c;font-weight:600">Attendees are simulated and watermarked "THESE ARE NOT REAL PEOPLE".</p>
<label>Meeting ID</label><input id="mid" placeholder="e.g. 123 456 789 012">
<label>Passcode</label><input id="pw" placeholder="e.g. aBcDeF">
<label>Number of simulated people</label>
<select id="count"></select>
<label>Participant names (suggested names can be overwritten)</label>
<div id="names" style="display:grid;grid-template-columns:1fr 1fr;gap:6px"></div>
<button id="join">Join meeting</button><button class="leave" id="leave">Remove all</button>
<h3>Conversation</h3>
<label>Meeting industry / tone</label><select id="industry"></select>
<label>Meeting length (minutes, 0 = no limit)</label>
<input id="mins" type="number" min="0" max="60" value="3" style="width:100px">
<label>Topic brief</label><textarea id="topic" rows="3" style="width:100%;padding:8px;font-size:15px;box-sizing:border-box" placeholder="Short description of what the meeting is about"></textarea>
<button id="start" disabled>Start conversation</button><button class="leave" id="stop">Stop</button>
<div id="cstat" style="margin-top:10px;color:#555"></div>
<div id="tx" style="margin-top:8px;max-height:260px;overflow:auto;border:1px solid #ddd;padding:8px;display:none"></div>
<h3>Attendees</h3><ul id="list"></ul>
<script>
const sel=document.getElementById('count');
for(let i=1;i<=12;i++)sel.add(new Option(i,i));
const $=id=>document.getElementById(id);
let PERS=[];
const nameBoxes=()=>[...document.querySelectorAll('#names input')];
function renderNames(){
  const old=nameBoxes().map(i=>i.value);
  $('names').innerHTML='';
  PERS.slice(0,+sel.value).forEach((p,i)=>{const e=document.createElement('input');e.value=old[i]||p.name;e.placeholder=p.name;e.title=p.id;$('names').appendChild(e);});
}
fetch('/api/personas').then(r=>r.json()).then(p=>{PERS=p;renderNames();});
sel.onchange=renderNames;
$('join').onclick=async()=>{
  const r=await fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({meetingId:$('mid').value,passcode:$('pw').value,count:sel.value,names:nameBoxes().map(i=>i.value)})});
  if(!r.ok)alert((await r.json()).error);
};
$('leave').onclick=()=>fetch('/api/leave',{method:'POST'});
async function refresh(){
  const [p,s,nm]=await Promise.all([fetch('/api/personas').then(r=>r.json()),fetch('/api/status').then(r=>r.json()),fetch('/api/names').then(r=>r.json())]);
  const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  $('list').innerHTML=p.map(x=>`<li><b>${esc(nm[x.id]||x.name)}</b> — ${s[x.id]||'idle'}${x.hasClip?'':' (no video clip yet)'}</li>`).join('');
}
fetch('/api/industries').then(r=>r.json()).then(l=>{window.IND=l;l.forEach(i=>$('industry').add(new Option(i.name,i.name)));$('industry').onchange=()=>{const b=IND.find(i=>i.name===$('industry').value).brief;if(b||!$('topic').value)$('topic').value=b;};$('industry').onchange();});
$('start').onclick=async()=>{const r=await fetch('/api/conversation/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({industry:$('industry').value,topic:$('topic').value,minutes:$('mins').value})});if(!r.ok)alert((await r.json()).error);};
$('stop').onclick=()=>fetch('/api/conversation/stop',{method:'POST'});
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function convo(){
  const c=await fetch('/api/conversation').then(r=>r.json());
  $('start').disabled=!c.ready||c.running;
  $('cstat').textContent=c.error?'Error: '+c.error:c.running?(c.speaking?c.speaking+' is speaking...':'Generating...'):c.ready?'All participants are in the meeting. Ready to start.':'Start becomes available once all participants are admitted.';
  $('tx').style.display=c.transcript.length?'block':'none';
  $('tx').innerHTML=c.transcript.map(t=>`<p><b>${esc(t.speaker)}:</b> ${esc(t.text)}</p>`).join('');
}
setInterval(refresh,2000);setInterval(convo,1500);refresh();convo();
</script></body></html>
